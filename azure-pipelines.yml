trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'Azure-Service-Connection'
  appName: 'codealpha-webapp-prod'
  acrName: 'codealpharegistry'
  imageName: 'codealpha-web-app'

stages:
  - stage: Build
    displayName: 'Build and Push Stage'
    jobs:
      - job: Build
        displayName: 'Build Docker Image'
        steps:
          - task: Docker@2
            displayName: 'Build and Push Docker Image to ACR'
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: '**/Dockerfile'
              containerRegistry: $(azureSubscription)
              tags: |
                latest
                $(Build.BuildId)

  - stage: Deploy
    displayName: 'Deployment Stage'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: 'Deploy to Azure App Service'
        steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy Web App Container'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(appName)
              imageName: '$(acrName).azurecr.io/$(imageName):$(Build.BuildId)'
